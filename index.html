<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Rakotoniaina Ny Avo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.7);
            --accent-color: #00f0ff;
            --text-color: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(112, 0, 255, 0.08) 0%, transparent 40%);
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color), #7000ff);
        }

        .badge {
            display: inline-block;
            font-family: 'Fira Code', monospace;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .info-box:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .info-box h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-box p {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .highlight {
            color: var(--accent-color);
            font-family: 'Fira Code', monospace;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 25px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <span class="badge">&gt; PORTFOLIO_SYS_V1.0</span>
            <h1>Rakotoniaina Ny Avo</h1>
            <p class="subtitle">Passionné d'informatique & de nouvelles technologies</p>

            <div class="info-grid">
                <div class="info-box">
                    <h3>Âge</h3>
                    <p>17 ans</p>
                </div>
                <div class="info-box">
                    <h3>Objectif Carrière</h3>
                    <p class="highlight">Informaticien</p>
                </div>
                <div class="info-box">
                    <h3>Spécialisation</h3>
                    <p class="highlight">Cybersécurité</p>
                </div>
            </div>

            <div class="status">
                <div class="status-dot"></div>
                <span>Disponible pour projets & études en informatique</span>
            </div>
        </div>
    </div>

</body>
  </html>
